<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宋維國文管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#080c14; --line:#1e2d4a; --gold:#c9a84c; --gold-dim:#8a6f2e; --text:#f0ede6; --muted:#7a8499; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg);
      background-image:
        radial-gradient(ellipse at 10% 0%,rgba(201,168,76,0.07) 0%,transparent 50%),
        radial-gradient(ellipse at 90% 100%,rgba(20,30,60,0.8) 0%,transparent 60%),
        repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(30,45,74,0.15) 60px,rgba(30,45,74,0.15) 61px),
        repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(30,45,74,0.08) 60px,rgba(30,45,74,0.08) 61px);
      color:var(--text); font-family:'Noto Serif TC',serif; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .wrap { width:100%; max-width:400px; animation:fadeUp 0.6s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .card {
      background:linear-gradient(160deg,rgba(14,20,32,0.98),rgba(8,12,20,0.98));
      border:1px solid var(--line); border-radius:20px; padding:44px 36px 36px;
      box-shadow:0 40px 100px rgba(0,0,0,0.7); position:relative; overflow:hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    .logo { font-family:'Playfair Display',serif; font-size:2.6rem; color:var(--gold); text-shadow:0 0 40px rgba(201,168,76,0.5); text-align:center; letter-spacing:0.12em; margin-bottom:6px; }
    .ornament { text-align:center; color:var(--gold-dim); font-size:16px; letter-spacing:10px; margin-bottom:6px; }
    .subtitle { text-align:center; color:var(--muted); font-size:11px; letter-spacing:0.2em; margin-bottom:36px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:11px; color:var(--muted); letter-spacing:0.12em; margin-bottom:6px; }
    input {
      width:100%; background:rgba(8,12,20,0.9); border:1px solid var(--line); color:var(--text);
      border-radius:10px; padding:12px 16px; font-family:'Noto Serif TC',serif; font-size:15px;
      outline:none; transition:border-color 0.2s,box-shadow 0.2s;
    }
    input:focus { border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(201,168,76,0.08); }
    input::placeholder { color:#3a4560; }
    .btn-login {
      width:100%; margin-top:8px; padding:13px;
      background:linear-gradient(135deg,#7a5f28,#c9a84c,#7a5f28); background-size:200% 100%;
      color:#060a10; font-family:'Playfair Display',serif; font-size:15px; font-weight:700;
      letter-spacing:0.2em; border:1px solid var(--gold-dim); border-radius:10px;
      cursor:pointer; transition:background-position 0.4s,box-shadow 0.2s,transform 0.1s;
    }
    .btn-login:hover { background-position:right; box-shadow:0 0 30px rgba(201,168,76,0.25); transform:translateY(-1px); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .error-msg { text-align:center; font-size:13px; color:#fca5a5; min-height:20px; margin-top:12px; }
    .footer-note { text-align:center; color:#1e2d4a; font-size:11px; margin-top:28px; letter-spacing:0.1em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">宋維</div>
      <div class="ornament">◆ ◇ ◆</div>
      <div class="subtitle">國文教務管理系統</div>
      <div class="field">
        <label>帳號</label>
        <input id="accountInput" type="text" placeholder="輸入帳號（如：宋維、eric）" autocomplete="username" />
      </div>
      <div class="field">
        <label>密碼</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-login" id="loginBtn">登　入</button>
      <div class="error-msg" id="loginMsg"></div>
    </div>
    <div class="footer-note">SONGWAYC © 2025</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = { apiKey:"AIzaSyDwu_7-Dt8S5g9jsyYcZI-5SQ-Wdc5pxqE", authDomain:"songwayc-2fba1.firebaseapp.com", projectId:"songwayc-2fba1", storageBucket:"songwayc-2fba1.firebasestorage.app", messagingSenderId:"560805644727", appId:"1:560805644727:web:3894efaff8479f1203c032" };
    const auth = getAuth(initializeApp(firebaseConfig));
    const $ = id => document.getElementById(id);

    const ACCOUNT_MAP = {
      "宋維":"songwei@songwayc.com","songwei":"songwei@songwayc.com",
      "宋洋":"songyang@songwayc.com","songyang":"songyang@songwayc.com",
      "宋彥":"songyan@songwayc.com","songyan":"songyan@songwayc.com",
      "eric":"eric@songwayc.com","Eric":"eric@songwayc.com","ERIC":"eric@songwayc.com",
    };

    function resolve(input) {
      const t = input.trim();
      if (t.includes("@")) return t;
      const lower = t.toLowerCase();
      for (const [k,v] of Object.entries(ACCOUNT_MAP)) {
        if (k === t || k.toLowerCase() === lower) return v;
      }
      return null;
    }

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "dashboard.html";
    });

    async function doLogin() {
      $("loginMsg").textContent = "";
      const account = $("accountInput").value.trim();
      const password = $("password").value;
      if (!account) { $("loginMsg").textContent = "請輸入帳號"; return; }
      if (!password) { $("loginMsg").textContent = "請輸入密碼"; return; }
      const email = resolve(account);
      if (!email) { $("loginMsg").textContent = "找不到此帳號"; return; }
      $("loginBtn").disabled = true;
      $("loginBtn").textContent = "登入中…";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch {
        $("loginMsg").textContent = "密碼錯誤或帳號不存在";
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = "登　入";
      }
    }

    $("loginBtn").addEventListener("click", doLogin);
    $("accountInput").addEventListener("keydown", e => { if(e.key==="Enter") $("password").focus(); });
    $("password").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  </script>
</body>
</html>
