<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宋維國文 — 教務管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--panel:#0e1420;--panel-2:#141d30;--line:#1e2d4a;--gold:#c9a84c;--gold-light:#e8c96d;--gold-dim:#8a6f2e;--text:#f0ede6;--muted:#7a8499;}
    *{box-sizing:border-box;}
    body{background:var(--bg);background-image:radial-gradient(ellipse at 10% 0%,rgba(201,168,76,0.06) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(30,45,74,0.12) 60px,rgba(30,45,74,0.12) 61px),repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(30,45,74,0.07) 60px,rgba(30,45,74,0.07) 61px);color:var(--text);font-family:'Noto Serif TC',serif;min-height:100vh;}
    ::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}
    .luxe-card{background:linear-gradient(145deg,rgba(14,20,32,0.97),rgba(10,15,24,0.97));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(201,168,76,0.07);position:relative;overflow:hidden;}
    .luxe-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.35),transparent);}
    .gold-title{color:var(--gold);letter-spacing:0.08em;font-family:'Playfair Display','Noto Serif TC',serif;}
    .mono{font-family:'JetBrains Mono',monospace;}
    .input,select,textarea{width:100%;background:rgba(8,12,20,0.8);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 14px;font-family:'Noto Serif TC',serif;font-size:14px;transition:border-color 0.2s,box-shadow 0.2s;outline:none;}
    .input:focus,select:focus{border-color:var(--gold-dim);box-shadow:0 0 0 2px rgba(201,168,76,0.1);}
    select option{background:var(--panel);}
    .btn{border-radius:8px;padding:10px 16px;color:white;font-size:14px;font-family:'Noto Serif TC',serif;cursor:pointer;border:none;transition:opacity 0.2s,transform 0.1s;letter-spacing:0.03em;}
    .btn:hover{opacity:0.85;transform:translateY(-1px);}
    .btn:active{transform:translateY(0);}
    .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
    .btn-gold{background:linear-gradient(135deg,#8a6f2e,#c9a84c,#8a6f2e);background-size:200% 100%;color:#080c14;font-weight:700;border:1px solid var(--gold-dim);}
    header{border-bottom:1px solid var(--line);background:rgba(8,12,20,0.92);backdrop-filter:blur(12px);}
    .nav-item{padding:8px 12px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.2s;letter-spacing:0.03em;}
    .nav-item:hover{color:var(--gold-light);border-color:var(--line);background:rgba(201,168,76,0.05);}
    .nav-item.active{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,0.08);}
    .calendar-grid{display:grid;grid-template-columns:72px 1fr;max-height:560px;overflow:auto;}
    .time-cell{border-right:1px solid var(--line);border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding:8px;background:rgba(8,12,20,0.9);font-family:'JetBrains Mono',monospace;}
    .slot-cell{border-top:1px solid var(--line);padding:6px 10px;min-height:40px;background:rgba(10,14,22,0.6);}
    .event-pill{background:linear-gradient(135deg,rgba(138,111,46,0.3),rgba(201,168,76,0.15));border:1px solid var(--gold-dim);border-radius:6px;font-size:11px;padding:6px;margin-bottom:4px;color:var(--gold-light);line-height:1.4;}
    .section-panel{display:none;}.section-panel.active{display:block;}
    .gold-divider{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:16px 0;}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;}
    .badge-admin{background:rgba(201,168,76,0.15);border:1px solid var(--gold-dim);color:var(--gold);}
    .badge-teacher{background:rgba(30,45,74,0.8);border:1px solid var(--line);color:var(--muted);}
    .user-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,0.6);position:relative;max-height:90vh;overflow-y:auto;}
    .msg-ok{color:#6ee7b7;font-size:13px;}.msg-err{color:#fca5a5;font-size:13px;}
    .clickable-link{color:#6ee7b7;text-decoration:underline;cursor:pointer;}
    .recurring-box{background:rgba(201,168,76,0.05);border:1px dashed var(--gold-dim);padding:12px;border-radius:8px;margin:8px 0;}
  </style>
</head>
<body>
  <header class="sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-5 py-3 flex items-center justify-between gap-3">
      <div>
        <div style="font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);letter-spacing:0.1em;text-shadow:0 0 20px rgba(201,168,76,0.4)">Songwayc</div>
        <p id="userInfo" class="mono" style="font-size:11px;color:var(--muted);margin-top:1px"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="dayBtn" class="btn" style="background:var(--panel-2);font-size:13px;padding:8px 12px">日</button>
        <button id="weekBtn" class="btn" style="background:var(--gold-dim);font-size:13px;padding:8px 12px">週</button>
        <button id="changePwdBtn" class="btn" style="background:#0f766e;font-size:13px;padding:8px 14px">修改密碼</button>
        <button id="logoutBtn" class="btn" style="background:rgba(192,57,43,0.3);border:1px solid rgba(192,57,43,0.5);font-size:13px;padding:8px 14px">登出</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-4">
    <aside class="lg:col-span-3">
      <div class="luxe-card rounded-xl p-4 sticky top-20">
        <div class="gold-title text-sm mb-3" style="letter-spacing:0.12em">功能導覽</div>
        <hr class="gold-divider" style="margin:0 0 12px 0">
        <ul id="navList" class="space-y-1"></ul>
      </div>
    </aside>
    <section class="lg:col-span-9 space-y-4">
      <div id="panel-calendar" class="section-panel luxe-card rounded-xl p-4">
        <div class="flex justify-between items-center mb-3"><h3 class="font-semibold" style="color:var(--gold-light)">排程行事曆</h3><input id="targetDate" type="date" class="input" style="max-width:180px" /></div>
        <div id="calendarHeader" class="grid text-xs mb-2" style="color:var(--muted)"></div>
        <div id="calendarBody" class="calendar-grid border rounded" style="border-color:var(--line)"></div>
      </div>

      <div id="panel-schedule" class="section-panel luxe-card rounded-xl p-4">
        <h3 class="gold-title text-sm mb-4">新增課程 (管理者)</h3>
        <form id="scheduleForm" class="grid md:grid-cols-2 gap-3">
          <select id="assignTeacher" class="input" required><option value="">-- 指派老師 --</option></select>
          <select id="academicPeriod" class="input" required>
            <option value="">-- 選擇學期區間 --</option>
            <option value="114上學期">114 上學期</option>
            <option value="114寒假">114 寒假</option>
            <option value="114下學期">114 下學期</option>
            <option value="114暑假">114 暑假</option>
          </select>
          <div class="md:col-span-2 space-y-2">
            <label class="text-xs text-gray-400">第一堂課的上課日期與時間：</label>
            <div class="grid grid-cols-2 gap-3">
              <input id="startAt" type="datetime-local" required class="input" />
              <input id="endAt" type="datetime-local" required class="input" />
            </div>
          </div>
          
          <div class="md:col-span-2 recurring-box">
            <div class="flex items-center gap-2 mb-2">
              <input type="checkbox" id="isRecurring" class="w-4 h-4" />
              <label for="isRecurring" class="text-sm font-semibold text-gold-light">設定為每週固定排課 (按週循環)</label>
            </div>
            <div id="recurrenceFields" class="hidden space-y-2">
              <label class="text-xs text-gray-400">重複直到該日期為止 (例如學期結束日)：</label>
              <input id="recurrenceEndDate" type="date" class="input" />
            </div>
          </div>

          <input id="region" placeholder="地區 (如：板橋)" required class="input" />
          <input id="instituteName" placeholder="補習班名稱" required class="input" />
          <input id="grade" placeholder="年級" required class="input" />
          <input id="expectedStudents" type="number" min="1" placeholder="預估人數" required class="input" />
          <select id="courseType" class="input" required><option value="">課程類型</option><option value="regular">常態排課</option><option value="single">單次代調課</option></select>
          <button id="saveScheduleBtn" class="btn btn-gold md:col-span-2" type="submit">確認新增並排入課表</button>
        </form><p id="scheduleMsg" class="mt-2 text-center"></p>
      </div>

      <div id="panel-attendance" class="section-panel luxe-card rounded-xl p-4">
        <h3 class="gold-title text-sm mb-4">打卡與日誌</h3>
        <div class="grid md:grid-cols-2 gap-3 mb-4"><select id="attendanceSchedule" class="input"></select><button id="reloadSchedules" class="btn" style="background:var(--panel-2)">載入今日課表</button></div>
        <form id="checkInForm" class="grid md:grid-cols-2 gap-3 mb-4"><input id="checkInPhoto" type="file" accept="image/*" capture="environment" required class="input" /><button class="btn" style="background:#3730a3" type="submit">上課打卡</button></form>
        <hr class="gold-divider">
        <form id="checkOutForm" class="grid md:grid-cols-2 gap-3">
          <input id="checkOutPhoto" type="file" accept="image/*" capture="environment" required class="input" /><input id="teachingProgress" placeholder="教學進度" required class="input" />
          <input id="testScope" placeholder="測驗範圍" required class="input" /><input id="scoreRange" placeholder="成績區間" required class="input" />
          <input id="homework" placeholder="回家作業" required class="input" /><input id="examPaperCode" placeholder="考卷代碼" required class="input" />
          <button class="btn btn-gold md:col-span-2" type="submit">下課打卡提交日誌</button>
        </form><p id="attendanceMsg" class="mt-2"></p>
      </div>

      <div id="panel-institutes" class="section-panel luxe-card rounded-xl p-4">
        <h3 class="gold-title text-sm mb-4">補習班資料庫</h3>
        <form id="instituteForm" class="grid md:grid-cols-2 gap-3 mb-4">
          <input id="insName" placeholder="補習班名稱" required class="input" /><input id="insOwner" placeholder="負責人" class="input" />
          <input id="insDirectorContact" placeholder="主任聯絡" class="input" /><input id="insLine" placeholder="LINE" class="input" />
          <input id="insCopier" placeholder="影印機密碼" class="input" /><input id="insParking" placeholder="停車規定" class="input" />
          <button class="btn btn-gold md:col-span-2" type="submit">新增補習班</button>
        </form>
        <div id="instituteCards" class="grid md:grid-cols-2 gap-3"></div>
      </div>

      <div id="panel-rosters" class="section-panel luxe-card rounded-xl p-4">
        <h3 class="gold-title text-sm mb-4">名冊管理 (廠商/儲備老師)</h3>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="space-y-3">
            <h4 class="text-xs text-gray-400">新增儲備老師</h4>
            <input id="rtName" placeholder="姓名" class="input" /><input id="rtPhone" placeholder="電話" class="input" /><button id="addRT" class="btn w-full" style="background:#4f46e5">儲存老師</button>
            <div id="rtList" class="text-xs space-y-1"></div>
          </div>
          <div class="space-y-3">
            <h4 class="text-xs text-gray-400">合作廠商</h4>
            <input id="vdName" placeholder="廠商名" class="input" /><input id="vdService" placeholder="服務內容" class="input" /><button id="addVD" class="btn w-full" style="background:#0891b2">儲存廠商</button>
            <div id="vdList" class="text-xs space-y-1"></div>
          </div>
        </div>
      </div>

      <div id="panel-salary" class="section-panel luxe-card rounded-xl p-4">
        <h3 class="gold-title text-sm mb-4">薪資與月結</h3>
        <form id="salaryConfigForm" class="grid md:grid-cols-4 gap-3 mb-4">
          <input id="salaryTeacherId" placeholder="老師 UID" required class="input" /><input id="baseRate" type="number" placeholder="鐘點費" class="input" />
          <button class="btn btn-gold md:col-span-2" type="submit">儲存參數</button>
        </form>
        <form id="salaryCalcForm" class="grid md:grid-cols-3 gap-3"><input id="settleTeacherId" placeholder="老師 UID" class="input" /><input id="settleMonth" type="month" class="input" /><button class="btn btn-gold" type="submit">計算月結</button></form>
        <div id="salaryResult" class="mt-3 mono text-sm text-center"></div>
      </div>

      <div id="panel-users" class="section-panel luxe-card rounded-xl p-4">
        <div class="flex items-center justify-between mb-4"><h3 class="gold-title text-sm">使用者管理</h3><button id="openAddUserBtn" class="btn btn-gold" style="font-size:12px;padding:6px 12px">＋ 新增帳號</button></div>
        <div id="userList" class="space-y-1"></div>
      </div>
    </section>
  </main>

  <div id="addUserModal" class="modal-overlay hidden"><div class="modal-box">
    <div class="gold-title text-base mb-4">新增帳號</div>
    <div class="space-y-3"><input id="newUserName" placeholder="名稱" class="input" /><input id="newUserEmail" type="email" placeholder="Email" class="input" /><input id="newUserPassword" type="password" class="input" value="0000" /><select id="newUserRole" class="input"><option value="Admin">Admin</option><option value="Teacher">Teacher</option></select><button id="confirmAddUserBtn" class="btn btn-gold w-full">確認</button><button class="btn close-modal w-full mt-2" style="background:var(--panel-2)">取消</button></div>
    <p id="addUserMsg" class="mt-2 text-center"></p>
  </div></div>

  <div id="changePwdModal" class="modal-overlay hidden"><div class="modal-box">
    <div class="gold-title text-base mb-4">修改密碼</div>
    <div class="space-y-3"><input id="newPassword" type="password" placeholder="輸入新密碼 (至少6碼)" class="input" /><button id="confirmPwdBtn" class="btn btn-gold w-full">更新密碼</button><button class="btn close-modal w-full mt-2" style="background:var(--panel-2)">取消</button></div>
    <p id="pwdMsg" class="mt-2 text-center"></p>
  </div></div>

  <div id="insDetailModal" class="modal-overlay hidden"><div class="modal-box">
    <div id="insDetailContent" class="text-sm leading-relaxed"></div>
    <button class="btn close-modal w-full mt-4" style="background:var(--panel-2)">關閉</button>
  </div></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, Timestamp, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

    const firebaseConfig={apiKey:"AIzaSyDwu_7-Dt8S5g9jsyYcZI-5SQ-Wdc5pxqE",authDomain:"songwayc-2fba1.firebaseapp.com",projectId:"songwayc-2fba1",storageBucket:"songwayc-2fba1.firebasestorage.app",messagingSenderId:"560805644727",appId:"1:560805644727:web:3894efaff8479f1203c032"};
    const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
    const $=id=>document.getElementById(id);
    let currentUser=null,currentRole="Teacher",currentMode="week",todaySchedules=[],teacherMap={};

    const adminSections=[{l:"排程行事曆",p:"calendar"},{l:"新增課程",p:"schedule"},{l:"打卡紀錄",p:"attendance"},{l:"補習班庫",p:"institutes"},{l:"名冊管理",p:"rosters"},{l:"薪資管理",p:"salary"},{l:"用戶管理",p:"users"}];
    const teacherSections=[{l:"我的課表",p:"calendar"},{l:"打卡日誌",p:"attendance"}];

    document.querySelectorAll(".close-modal").forEach(b=>b.addEventListener("click",e=>e.target.closest(".modal-overlay").classList.add("hidden")));

    onAuthStateChanged(auth,async u=>{
      if(!u){window.location.href="index.html";return;}
      const snap=await getDoc(doc(db,"users",u.uid));
      if(snap.exists() && snap.data().status==="disabled"){alert("停權帳號");signOut(auth);return;}
      currentUser=u; currentRole=snap.exists()?snap.data().role:"Teacher";
      $("userInfo").textContent=`${u.email} · ${currentRole}`;
      drawNav(currentRole); $("targetDate").value=fmtDate(new Date());
      setMode("week"); await renderCalendar(); await loadTodaySchedules();
    });

    $("logoutBtn").onclick=()=>signOut(auth);
    $("dayBtn").onclick=()=>setMode("day");
    $("weekBtn").onclick=()=>setMode("week");
    $("targetDate").onchange=()=>renderCalendar();
    $("reloadSchedules").onclick=()=>loadTodaySchedules();

    $("isRecurring").onchange=e=>{$("recurrenceFields").classList.toggle("hidden", !e.target.checked);};

    $("changePwdBtn").onclick=()=>{$("changePwdModal").classList.remove("hidden");$("pwdMsg").textContent="";};
    $("confirmPwdBtn").onclick=async()=>{
      const p=$("newPassword").value; if(p.length<6)return;
      try{await updatePassword(currentUser,p);$("pwdMsg").textContent="✓ 修改成功";setTimeout(()=>$("changePwdModal").classList.add("hidden"),1000);}catch(e){$("pwdMsg").textContent=e.message;}
    };

    function drawNav(r){
      const nav=$("navList"); nav.innerHTML="";
      (r==="Admin"?adminSections:teacherSections).forEach(s=>{
        const li=document.createElement("li"); li.className="nav-item"; li.textContent=s.l;
        li.onclick=()=>{showPanel(s.p,li);}; nav.appendChild(li);
      });
      nav.firstChild.click();
    }

    async function showPanel(p,el){
      document.querySelectorAll(".section-panel").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
      $("panel-"+p).classList.add("active"); el.classList.add("active");
      if(p==="schedule" && currentRole==="Admin") loadTeachers();
      if(p==="institutes") renderInstitutes();
      if(p==="rosters") renderRosters();
      if(p==="users") renderUserList();
    }

    async function loadTeachers(){
      const s=$("assignTeacher"),snap=await getDocs(query(collection(db,"users"),where("role","==","Teacher")));
      s.innerHTML='<option value="">-- 指派老師 --</option>'; teacherMap={};
      snap.forEach(d=>{
        teacherMap[d.id]=d.data().displayName||d.data().email;
        const o=document.createElement("option"); o.value=d.id; o.textContent=teacherMap[d.id]; s.appendChild(o);
      });
    }

    $("scheduleForm").onsubmit=async e=>{
      e.preventDefault(); if(currentRole!=="Admin")return;
      
      const saveBtn = $("saveScheduleBtn");
      saveBtn.disabled = true; saveBtn.textContent = "排課中...";
      
      const teacherId = $("assignTeacher").value;
      const period = $("academicPeriod").value;
      const startInput = $("startAt").value;
      const endInput = $("endAt").value;
      const isRecurring = $("isRecurring").checked;
      const recurEndDate = $("recurrenceEndDate").value;
      
      const baseStart = new Date(startInput);
      const baseEnd = new Date(endInput);
      
      try{
        let currentStart = new Date(baseStart);
        let currentEnd = new Date(baseEnd);
        const limitDate = isRecurring ? new Date(recurEndDate) : new Date(baseStart);
        
        let count = 0;
        // 循環直到超過結束日期 (每次加 7 天)
        while(currentStart <= limitDate) {
          await addDoc(collection(db,"schedules"),{
            date: fmtDate(currentStart),
            startAt: Timestamp.fromDate(new Date(currentStart)),
            endAt: Timestamp.fromDate(new Date(currentEnd)),
            teacherId: teacherId, 
            teacherName: teacherMap[teacherId],
            academicPeriod: period, 
            instituteName: $("instituteName").value,
            grade: $("grade").value, 
            expectedStudents: Number($("expectedStudents").value),
            region: $("region").value, 
            courseType: $("courseType").value, 
            createdAt: Timestamp.now()
          });
          
          if(!isRecurring) break;
          // 前往下一週
          currentStart.setDate(currentStart.getDate() + 7);
          currentEnd.setDate(currentEnd.getDate() + 7);
          count++;
        }
        
        e.target.reset();
        $("recurrenceFields").classList.add("hidden");
        $("scheduleMsg").textContent = `✓ 成功建立 ${count||1} 堂課程！`;
        renderCalendar();
      }catch(err){
        $("scheduleMsg").textContent = "錯誤：" + err.message;
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = "確認新增並排入課表";
      }
    };

    async function renderCalendar(){
      const base=new Date($("targetDate").value), days=currentMode==="day"?[base]:weekDays(base);
      const head=$("calendarHeader"), body=$("calendarBody");
      head.style.gridTemplateColumns=`72px repeat(${days.length},1fr)`;
      head.innerHTML=`<div></div>`+days.map(d=>`<div class="text-center p-1">${d.getDate()}(${['日','一','二','三','四','五','六'][d.getDay()]})</div>`).join("");
      body.style.gridTemplateColumns=`72px repeat(${days.length},1fr)`; body.innerHTML="";
      const events=await Promise.all(days.map(d=>getDocs(query(collection(db,"schedules"),where("date","==",fmtDate(d))))));
      
      for(let h=7;h<=22;h++){
        const t=document.createElement("div"); t.className="time-cell text-center"; t.textContent=`${h}:00`; body.appendChild(t);
        days.forEach((_,idx)=>{
          const slot=document.createElement("div"); slot.className="slot-cell";
          events[idx].forEach(d=>{
            const ev=d.data(); if(ev.startAt.toDate().getHours()!==h)return;
            if(currentRole!=="Admin" && ev.teacherId!==currentUser.uid) return;
            const p=document.createElement("div"); p.className="event-pill";
            p.innerHTML=`<span style="font-weight:700" onclick="openIns('${ev.instituteName}')" class="clickable-link">${ev.instituteName}</span><br>${hhmm(ev.startAt.toDate())}-${hhmm(ev.endAt.toDate())}<br>[${ev.academicPeriod}]<br>${currentRole==="Admin"?'👤'+(ev.teacherName||'無'):''}`;
            slot.appendChild(p);
          });
          body.appendChild(slot);
        });
      }
    }

    window.openIns=async n=>{
      const snap=await getDocs(query(collection(db,"institutes"),where("name","==",n)));
      const c=$("insDetailContent"); if(snap.empty){c.innerHTML="無補習班詳細資料"; } else {
        const i=snap.docs[0].data(); c.innerHTML=`<b>${i.name}</b><hr class='my-2 opacity-20'>負責人：${i.ownerName||'-'}<br>主任：${i.directorContact||'-'}<br>影印機密碼：${i.copierPassword||'-'}<br>停車規定：${i.parkingRule||'-'}`;
      }
      $("insDetailModal").classList.remove("hidden");
    };

    async function loadTodaySchedules(){
      const snap=await getDocs(query(collection(db,"schedules"),where("date","==",fmtDate(new Date()))));
      const s=$("attendanceSchedule"); s.innerHTML='<option value="">-- 選擇課表打卡 --</option>';
      snap.forEach(d=>{
        const ev=d.data(); if(currentRole!=="Admin" && ev.teacherId!==currentUser.uid) return;
        const o=document.createElement("option"); o.value=d.id; o.textContent=`${ev.instituteName} (${ev.grade})`; s.appendChild(o);
      });
    }

    async function renderUserList(){
      const c=$("userList"); c.innerHTML="載入中..."; const snap=await getDocs(collection(db,"users")); c.innerHTML="";
      snap.forEach(d=>{
        const u=d.data(), r=document.createElement("div"); r.className="user-row p-2 bg-black/20 rounded mb-1";
        r.innerHTML=`<span class="text-xs">${u.displayName||u.email}</span><span class="badge ${u.role==='Admin'?'badge-admin':'badge-teacher'}">${u.role}</span><button onclick="disableUser('${d.id}')" class="btn bg-red-900/50 p-1 px-2 text-[10px]">停權</button>`;
        c.appendChild(r);
      });
    }
    window.disableUser=async id=>{ if(confirm("停權此帳號？")) await updateDoc(doc(db,"users",id),{status:"disabled"}); renderUserList();};

    function weekDays(d){ const day=d.getDay(), diff=d.getDate()-day+(day===0?-6:1); const mon=new Date(d.setDate(diff)); return Array.from({length:7},(_,i)=>new Date(new Date(mon).setDate(mon.getDate()+i))); }
    function fmtDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
    function hhmm(d){ return d.toTimeString().slice(0,5); }

    async function renderInstitutes(){
      const c=$("instituteCards"), snap=await getDocs(collection(db,"institutes")); c.innerHTML="";
      snap.forEach(d=>{ const i=d.data(); const div=document.createElement("div"); div.className="p-3 bg-white/5 border border-white/10 rounded text-xs"; div.innerHTML=`<b>${i.name}</b><br>影印：${i.copierPassword||'-'}<br>停車：${i.parkingRule||'-'}`; c.appendChild(div); });
    }
    async function renderRosters(){
      const r=$("rtList"), v=$("vdList"); r.innerHTML=v.innerHTML="載入中...";
      const rs=await getDocs(collection(db,"reserveTeachers")), vs=await getDocs(collection(db,"vendors"));
      r.innerHTML=""; rs.forEach(d=>{ const x=d.data(); r.innerHTML+=`<div class='p-1 border-b border-white/5'>${x.name} - ${x.phone}</div>`;});
      v.innerHTML=""; vs.forEach(d=>{ const x=d.data(); v.innerHTML+=`<div class='p-1 border-b border-white/5'>${x.name} (${x.service})</div>`;});
    }
    $("addRT").onclick=async()=>{ await addDoc(collection(db,"reserveTeachers"),{name:$("rtName").value,phone:$("rtPhone").value,createdAt:Timestamp.now()}); renderRosters(); };
    $("addVD").onclick=async()=>{ await addDoc(collection(db,"vendors"),{name:$("vdName").value,service:$("vdService").value,createdAt:Timestamp.now()}); renderRosters(); };

  </script>
</body>
</html>
