<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>宋維國文 — 教務管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--panel:#0e1420;--panel-2:#141d30;--line:#1e2d4a;--gold:#c9a84c;--gold-light:#e8c96d;--gold-dim:#8a6f2e;--text:#f0ede6;--muted:#7a8499;--row:52px;}
    *{box-sizing:border-box;}
    body{background:var(--bg);background-image:radial-gradient(ellipse at 10% 0%,rgba(201,168,76,.06) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(30,45,74,.12) 60px,rgba(30,45,74,.12) 61px);color:var(--text);font-family:'Noto Serif TC',serif;min-height:100vh;}
    ::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}
    .luxe-card{background:linear-gradient(145deg,rgba(14,20,32,.97),rgba(10,15,24,.97));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(201,168,76,.07);position:relative;overflow:hidden;}
    .luxe-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.35),transparent);}
    .gold-title{color:var(--gold);letter-spacing:.08em;font-family:'Playfair Display','Noto Serif TC',serif;}
    .mono{font-family:'JetBrains Mono',monospace;}
    .input,select,textarea{width:100%;background:rgba(8,12,20,.8);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 14px;font-family:'Noto Serif TC',serif;font-size:14px;transition:border-color .2s,box-shadow .2s;outline:none;}
    .input:focus,select:focus{border-color:var(--gold-dim);box-shadow:0 0 0 2px rgba(201,168,76,.1);}
    select option{background:var(--panel);}
    .btn{border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;font-family:'Noto Serif TC',serif;cursor:pointer;border:none;transition:opacity .2s,transform .1s;letter-spacing:.03em;}
    .btn:hover{opacity:.85;transform:translateY(-1px);}
    .btn:active{transform:translateY(0);}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
    .btn-gold{background:linear-gradient(135deg,#8a6f2e,#c9a84c,#8a6f2e);background-size:200% 100%;color:#080c14;font-weight:700;border:1px solid var(--gold-dim);}
    .btn-gold:hover{background-position:right;opacity:1;}
    .btn-red{background:rgba(192,57,43,.35);border:1px solid rgba(192,57,43,.5);}
    .btn-teal{background:#0f766e;}
    header{border-bottom:1px solid var(--line);background:rgba(8,12,20,.92);backdrop-filter:blur(12px);}
    .nav-item{padding:8px 12px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;display:block;width:100%;text-align:left;}
    .nav-item:hover{color:var(--gold-light);border-color:var(--line);background:rgba(201,168,76,.05);}
    .nav-item.active{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.08);}
    .section-panel{display:none;}.section-panel.active{display:block;}
    .gold-divider{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:16px 0;}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:'JetBrains Mono',monospace;}
    .badge-admin{background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold);}
    .badge-teacher{background:rgba(30,45,74,.8);border:1px solid var(--line);color:var(--muted);}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:500px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative;max-height:92vh;overflow-y:auto;}
    .modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.5),transparent);}
    .msg-ok{color:#6ee7b7;font-size:13px;text-align:center;}
    .msg-err{color:#fca5a5;font-size:13px;text-align:center;}
    /* ── 時間軸行事曆 ── */
    .cal-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px;position:relative;}
    .cal-table{width:100%;border-collapse:collapse;min-width:680px;}
    .cal-th{background:rgba(8,12,20,.97);border-bottom:2px solid var(--gold-dim);padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);position:sticky;top:0;z-index:5;}
    .cal-th.today-col{color:var(--gold);font-weight:700;}
    .cal-time-col{width:52px;background:rgba(8,12,20,.95);border-right:1px solid var(--line);font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:right;padding:0 6px;vertical-align:top;position:sticky;left:0;z-index:2;white-space:nowrap;}
    .cal-day-col{border-right:1px solid rgba(30,45,74,.4);padding:0;vertical-align:top;position:relative;}
    .cal-row{height:var(--row);}
    .cal-row td{border-bottom:1px solid rgba(30,45,74,.35);}
    .cal-half{border-bottom:1px dashed rgba(30,45,74,.2);}
    .day-col-inner{position:relative;background:rgba(10,14,22,.5);}
    /* 課程區塊（絕對定位） */
    .ev-block{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:11px;line-height:1.45;cursor:pointer;overflow:hidden;z-index:2;transition:filter .15s;}
    .ev-block:hover{filter:brightness(1.2);}
    .ev-block.status-scheduled{background:linear-gradient(160deg,rgba(138,111,46,.45),rgba(201,168,76,.18));border:1px solid var(--gold-dim);}
    .ev-block.status-checkedin{background:linear-gradient(160deg,rgba(15,118,110,.55),rgba(52,211,153,.15));border:1px solid #0f766e;}
    .ev-block.status-absent{background:linear-gradient(160deg,rgba(127,29,29,.55),rgba(248,113,113,.12));border:1px solid #7f1d1d;}
    .ev-block.status-rescheduled{background:linear-gradient(160deg,rgba(55,48,163,.55),rgba(129,140,248,.15));border:1px solid #3730a3;}
    .ev-block.status-cancelled{background:rgba(30,30,30,.7);border:1px solid #374151;opacity:.6;}
    .ev-ins{color:var(--gold-light);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ev-time{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;}
    .ev-grade{color:#93c5fd;font-size:10px;}
    .ev-teacher{color:#86efac;font-size:10px;}
    .ev-status{font-size:10px;font-weight:700;}
    /* 動作按鈕格 */
    .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
    /* 使用者列 */
    .user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
    .user-card:last-child{border-bottom:none;}
    .user-card:hover{background:rgba(201,168,76,.03);}
    /* 名冊 */
    .roster-row{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;align-items:center;}
    .roster-row:last-child{border-bottom:none;}
    /* 補習班卡片 */
    .ins-card{padding:14px;border-radius:10px;border:1px solid var(--line);background:rgba(8,12,20,.7);transition:border-color .2s;cursor:pointer;}
    .ins-card:hover{border-color:var(--gold-dim);}
    .recurring-box{background:rgba(201,168,76,.04);border:1px dashed var(--gold-dim);padding:14px;border-radius:8px;}
    /* 薪資卡 */
    .salary-card{background:rgba(8,12,20,.6);border:1px solid var(--line);border-radius:10px;padding:16px;}
    .salary-num{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:1.1rem;font-weight:700;}
  </style>
</head>
<body>
<header class="sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-5 py-3 flex items-center justify-between gap-3">
    <div>
      <div style="font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);letter-spacing:.1em;text-shadow:0 0 20px rgba(201,168,76,.35)">Songwayc</div>
      <p id="userInfo" class="mono" style="font-size:11px;color:var(--muted);margin-top:1px"></p>
    </div>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <button id="dayBtn" class="btn" style="background:var(--panel-2);font-size:12px;padding:7px 11px">日</button>
      <button id="weekBtn" class="btn" style="background:var(--gold-dim);font-size:12px;padding:7px 11px">週</button>
      <button id="changePwdBtn" class="btn btn-teal" style="font-size:12px;padding:7px 12px">修改密碼</button>
      <button id="logoutBtn" class="btn btn-red" style="font-size:12px;padding:7px 12px">登出</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-3">
    <div class="luxe-card rounded-xl p-4 sticky top-20">
      <div class="gold-title text-sm mb-3" style="letter-spacing:.12em">功能導覽</div>
      <hr class="gold-divider" style="margin:0 0 10px 0">
      <ul id="navList" class="space-y-1"></ul>
      <!-- 圖例 -->
      <div class="mt-4 space-y-1" style="font-size:11px;color:var(--muted)">
        <div style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:rgba(201,168,76,.4);display:inline-block"></span>待上課</div>
        <div style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:rgba(15,118,110,.6);display:inline-block"></span>已到班</div>
        <div style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:rgba(127,29,29,.6);display:inline-block"></span>請假</div>
        <div style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:rgba(55,48,163,.6);display:inline-block"></span>調課</div>
        <div style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:#374151;display:inline-block"></span>停課</div>
      </div>
    </div>
  </aside>

  <section class="lg:col-span-9 space-y-4">

    <!-- ═══ 行事曆 ═══ -->
    <div id="panel-calendar" class="section-panel luxe-card rounded-xl p-4">
      <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
        <h3 class="gold-title text-sm">排程行事曆</h3>
        <div class="flex gap-2 items-center flex-wrap">
          <div id="adminTeacherFilter" class="hidden">
            <select id="filterTeacher" class="input" style="width:150px;padding:7px 10px;font-size:13px">
              <option value="all">全部老師</option>
            </select>
          </div>
          <input id="targetDate" type="date" class="input" style="max-width:155px;padding:7px 10px;font-size:13px"/>
        </div>
      </div>
      <div class="cal-wrap">
        <table class="cal-table" id="calTable"><thead id="calHead"></thead><tbody id="calBody"></tbody></table>
      </div>
    </div>

    <!-- ═══ 新增課程 ═══ -->
    <div id="panel-schedule" class="section-panel luxe-card rounded-xl p-4">
      <h3 class="gold-title text-sm mb-4">新增課程（管理者）</h3>
      <form id="scheduleForm" class="space-y-3">
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">指派老師</label><select id="assignTeacher" class="input mt-1" required><option value="">-- 選擇老師 --</option></select></div>
          <div><label class="text-xs" style="color:var(--muted)">學期區間</label>
            <select id="academicPeriod" class="input mt-1" required>
              <option value="">-- 選擇學期 --</option>
              <option value="114上學期">114 上學期</option><option value="114寒假">114 寒假</option>
              <option value="114下學期">114 下學期</option><option value="114暑假">114 暑假</option>
            </select>
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">上課時間</label><input id="startAt" type="datetime-local" required class="input mt-1"/></div>
          <div><label class="text-xs" style="color:var(--muted)">下課時間</label><input id="endAt" type="datetime-local" required class="input mt-1"/></div>
        </div>
        <div class="recurring-box">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="isRecurring" class="w-4 h-4" style="accent-color:var(--gold)">
            <span class="text-sm font-semibold" style="color:var(--gold-light)">每週固定排課（循環）</span>
          </label>
          <div id="recurrenceFields" class="hidden mt-3">
            <label class="text-xs" style="color:var(--muted)">重複直到</label>
            <input id="recurrenceEndDate" type="date" class="input mt-1"/>
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">地區</label><input id="region" placeholder="如：板橋" required class="input mt-1"/></div>
          <div><label class="text-xs" style="color:var(--muted)">補習班名稱</label><input id="instituteName" placeholder="補習班名稱" required class="input mt-1"/></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">學校層級</label>
            <select id="schoolLevel" class="input mt-1" required>
              <option value="">-- 選擇 --</option><option value="國小">國小</option><option value="國中">國中</option><option value="高中">高中</option>
            </select>
          </div>
          <div><label class="text-xs" style="color:var(--muted)">年級</label>
            <select id="gradeYear" class="input mt-1" required>
              <option value="">-- 年級 --</option><option value="1">一年級</option><option value="2">二年級</option><option value="3">三年級</option><option value="4">四年級</option><option value="5">五年級</option><option value="6">六年級</option>
            </select>
          </div>
          <div><label class="text-xs" style="color:var(--muted)">班級</label><input id="classId" placeholder="如：忠班" class="input mt-1"/></div>
        </div>
        <div class="grid md:grid-cols-3 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">預估人數</label><input id="expectedStudents" type="number" min="1" placeholder="人數" required class="input mt-1"/></div>
          <div><label class="text-xs" style="color:var(--muted)">課程類型</label>
            <select id="courseType" class="input mt-1" required>
              <option value="">-- 選擇 --</option><option value="regular">常態排課</option><option value="single">單次代調課</option>
            </select>
          </div>
          <div><label class="text-xs" style="color:var(--muted)">老師鐘點費（元/堂）</label><input id="teacherFeePerClass" type="number" min="0" placeholder="如：1000" class="input mt-1"/></div>
        </div>
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="text-xs" style="color:var(--muted)">補習班收費（元/堂）</label><input id="instituteRevenuePerClass" type="number" min="0" placeholder="如：3000" class="input mt-1"/></div>
          <div><label class="text-xs" style="color:var(--muted)">備註</label><input id="scheduleNote" placeholder="備註（選填）" class="input mt-1"/></div>
        </div>
        <button id="saveScheduleBtn" class="btn btn-gold w-full" type="submit">確認新增並排入課表</button>
      </form>
      <p id="scheduleMsg" class="mt-3 text-center text-sm"></p>
    </div>

    <!-- ═══ 課程管理 ═══ -->
    <div id="panel-coursemgr" class="section-panel luxe-card rounded-xl p-4">
      <h3 class="gold-title text-sm mb-4">課程管理</h3>
      <div class="flex flex-wrap gap-3 mb-4">
        <select id="cmFilterTeacher" class="input" style="width:150px;padding:7px 10px;font-size:13px"><option value="all">全部老師</option></select>
        <select id="cmFilterPeriod" class="input" style="width:150px;padding:7px 10px;font-size:13px">
          <option value="all">全部學期</option>
          <option value="114上學期">114 上學期</option>
          <option value="114寒假">114 寒假</option>
          <option value="114下學期">114 下學期</option>
          <option value="114暑假">114 暑假</option>
        </select>
        <select id="cmFilterStatus" class="input" style="width:130px;padding:7px 10px;font-size:13px">
          <option value="all">全部狀態</option>
          <option value="scheduled">待上課</option>
          <option value="checkedin">已到班</option>
          <option value="absent">請假</option>
          <option value="rescheduled">調課</option>
          <option value="cancelled">停課</option>
        </select>
        <button id="cmLoadBtn" class="btn btn-gold" style="padding:7px 16px;font-size:13px">載入課程</button>
      </div>
      <div id="cmSummary" class="text-xs mb-3" style="color:var(--muted)"></div>
      <div id="cmList" class="space-y-2"></div>
    </div>

    <!-- ═══ 補習班 ═══ -->
    <div id="panel-institutes" class="section-panel luxe-card rounded-xl p-4">
      <h3 class="gold-title text-sm mb-4">補習班資料庫</h3>
      <form id="instituteForm" class="grid md:grid-cols-2 gap-3 mb-4">
        <input id="insName" placeholder="補習班名稱" required class="input"/>
        <input id="insOwner" placeholder="負責人" class="input"/>
        <input id="insDirectorContact" placeholder="主任聯絡" class="input"/>
        <input id="insLine" placeholder="LINE 帳號" class="input"/>
        <input id="insCopier" placeholder="影印機密碼" class="input"/>
        <input id="insParking" placeholder="停車規定" class="input"/>
        <input id="insAddress" placeholder="地址" class="input"/>
        <input id="insPhone" placeholder="電話" class="input"/>
        <textarea id="insNote" placeholder="備註" class="input md:col-span-2" rows="2"></textarea>
        <button class="btn btn-gold md:col-span-2" type="submit">新增補習班</button>
      </form>
      <div id="instituteCards" class="grid md:grid-cols-2 gap-3"></div>
    </div>

    <!-- ═══ 名冊管理 ═══ -->
    <div id="panel-rosters" class="section-panel luxe-card rounded-xl p-4">
      <h3 class="gold-title text-sm mb-4">名冊管理</h3>
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <h4 class="text-xs mb-3 font-semibold" style="color:var(--gold-light)">儲備老師</h4>
          <div class="space-y-2 mb-3">
            <input id="rtName" placeholder="姓名" class="input"/><input id="rtPhone" placeholder="電話" class="input"/>
            <input id="rtSubject" placeholder="專長科目" class="input"/><input id="rtNote" placeholder="備註" class="input"/>
            <button id="addRT" class="btn w-full" style="background:#4f46e5">新增儲備老師</button>
          </div>
          <div id="rtList" class="rounded-lg overflow-hidden" style="border:1px solid var(--line)"></div>
        </div>
        <div>
          <h4 class="text-xs mb-3 font-semibold" style="color:var(--gold-light)">合作廠商</h4>
          <div class="space-y-2 mb-3">
            <input id="vdName" placeholder="廠商名稱" class="input"/><input id="vdService" placeholder="服務內容" class="input"/>
            <input id="vdContact" placeholder="聯絡人" class="input"/><input id="vdPhone" placeholder="電話" class="input"/>
            <button id="addVD" class="btn w-full" style="background:#0891b2">新增廠商</button>
          </div>
          <div id="vdList" class="rounded-lg overflow-hidden" style="border:1px solid var(--line)"></div>
        </div>
      </div>
    </div>

    <!-- ═══ 薪資（僅 Admin）═══ -->
    <div id="panel-salary" class="section-panel luxe-card rounded-xl p-4">
      <h3 class="gold-title text-sm mb-4">薪資 & 收入結算</h3>
      <div class="grid md:grid-cols-3 gap-3 mb-4">
        <div><label class="text-xs" style="color:var(--muted)">選擇月份</label><input id="settleMonth" type="month" class="input mt-1"/></div>
        <div class="flex items-end"><button id="calcAllBtn" class="btn btn-gold w-full">計算當月結算</button></div>
      </div>
      <div id="salaryResult" class="space-y-3"></div>
    </div>

    <!-- ═══ 使用者管理 ═══ -->
    <div id="panel-users" class="section-panel luxe-card rounded-xl p-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="gold-title text-sm">使用者管理</h3>
        <button id="openAddUserBtn" class="btn btn-gold" style="font-size:12px;padding:7px 14px">＋ 新增帳號</button>
      </div>
      <div id="userList" class="rounded-lg overflow-hidden" style="border:1px solid var(--line)">
        <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">載入中…</div>
      </div>
    </div>

  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

const FC={apiKey:"AIzaSyDwu_7-Dt8S5g9jsyYcZI-5SQ-Wdc5pxqE",authDomain:"songwayc-2fba1.firebaseapp.com",projectId:"songwayc-2fba1",storageBucket:"songwayc-2fba1.firebasestorage.app",messagingSenderId:"560805644727",appId:"1:560805644727:web:3894efaff8479f1203c032"};
const app=initializeApp(FC),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id);
const ROW_H=52; // px per hour (matches --row CSS var)
const CAL_START=7; // 07:00

let CU=null,CR="Teacher",CM="week",allUsers=[],teacherMap={};
let currentEventDocId=null,currentEventData=null;

const adminNav=[{l:"排程行事曆",p:"calendar"},{l:"新增課程",p:"schedule"},{l:"課程管理",p:"coursemgr"},{l:"補習班庫",p:"institutes"},{l:"名冊管理",p:"rosters"},{l:"薪資結算",p:"salary"},{l:"用戶管理",p:"users"}];
const teacherNav=[{l:"我的課表",p:"calendar"}];

// ── 關閉 modal ──
document.querySelectorAll(".close-modal").forEach(b=>b.onclick=e=>e.target.closest(".modal-overlay").classList.add("hidden"));
document.querySelectorAll(".modal-overlay").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add("hidden");});

// ── AUTH ──
onAuthStateChanged(auth,async u=>{
  if(!u){window.location.href="index.html";return;}
  const snap=await getDoc(doc(db,"users",u.uid));
  const ud=snap.exists()?snap.data():{};
  if(ud.status==="disabled"){alert("此帳號已被停權");await signOut(auth);return;}
  CU=u; CR=ud.role||"Teacher";
  $("userInfo").textContent=`${ud.displayName||u.email}  ·  ${CR}`;
  if(CR==="Admin") $("adminTeacherFilter").classList.remove("hidden");
  await loadAllUsers();
  drawNav();
  $("targetDate").value=fmtDate(new Date());
  setMode("week");
});

$("logoutBtn").onclick=()=>signOut(auth);
$("dayBtn").onclick=()=>setMode("day");
$("weekBtn").onclick=()=>setMode("week");
$("targetDate").onchange=()=>renderCalendar();
$("filterTeacher").onchange=()=>renderCalendar();
$("isRecurring").onchange=e=>$("recurrenceFields").classList.toggle("hidden",!e.target.checked);

// ── 修改密碼 ──
$("changePwdBtn").onclick=()=>{$("changePwdModal").classList.remove("hidden");$("pwdMsg").textContent="";$("newPassword").value="";$("confirmPassword").value="";};
$("confirmPwdBtn").onclick=async()=>{
  const p=$("newPassword").value,c=$("confirmPassword").value;
  if(p.length<6){$("pwdMsg").className="msg-err";$("pwdMsg").textContent="密碼至少6碼";return;}
  if(p!==c){$("pwdMsg").className="msg-err";$("pwdMsg").textContent="兩次密碼不一致";return;}
  try{await updatePassword(CU,p);$("pwdMsg").className="msg-ok";$("pwdMsg").textContent="✓ 密碼已更新";setTimeout(()=>$("changePwdModal").classList.add("hidden"),1200);}
  catch(e){$("pwdMsg").className="msg-err";$("pwdMsg").textContent=e.code==="auth/requires-recent-login"?"請重新登入後修改":e.message;}
};

// ── NAV ──
function drawNav(){
  const nav=$("navList"); nav.innerHTML="";
  (CR==="Admin"?adminNav:teacherNav).forEach((s,i)=>{
    const li=document.createElement("li"); li.className="nav-item"; li.textContent=s.l;
    li.onclick=()=>showPanel(s.p,li); nav.appendChild(li);
    if(i===0) setTimeout(()=>li.click(),80);
  });
}
async function showPanel(p,el){
  document.querySelectorAll(".section-panel").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  $("panel-"+p)?.classList.add("active"); el?.classList.add("active");
  if(p==="calendar") renderCalendar();
  if(p==="schedule"&&CR==="Admin") populateTeacherDropdowns();
  if(p==="coursemgr"&&CR==="Admin") renderCourseMgr();
  if(p==="rosters") renderRosters();
  if(p==="salary"&&CR==="Admin") renderSalaryPanel();
  if(p==="users") renderUserList();
}

// ── 使用者 ──
async function loadAllUsers(){
  const snap=await getDocs(collection(db,"users")); allUsers=[]; teacherMap={};
  snap.forEach(d=>{const u={id:d.id,...d.data()};allUsers.push(u);teacherMap[d.id]=u.displayName||u.email;});
  const fs=$("filterTeacher"); fs.innerHTML='<option value="all">全部老師</option>';
  allUsers.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.displayName||u.email;fs.appendChild(o);});
}
function populateTeacherDropdowns(){
  [$("assignTeacher")].forEach(sel=>{
    if(!sel)return; sel.innerHTML='<option value="">-- 選擇老師 --</option>';
    allUsers.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.displayName||u.email;sel.appendChild(o);});
  });
}

// ── 新增課程 ──
$("scheduleForm").onsubmit=async e=>{
  e.preventDefault(); if(CR!=="Admin")return;
  const btn=$("saveScheduleBtn"); btn.disabled=true; btn.textContent="排課中…";
  const tId=$("assignTeacher").value;
  const baseStart=new Date($("startAt").value), baseEnd=new Date($("endAt").value);
  const isRec=$("isRecurring").checked, recEnd=new Date($("recurrenceEndDate").value);
  const level=$("schoolLevel").value, year=$("gradeYear").value, cls=$("classId").value;
  const gradeStr=`${level}${year}年級${cls?`（${cls}）`:""}`;
  try{
    let s=new Date(baseStart),en=new Date(baseEnd),count=0;
    const limit=isRec?recEnd:new Date(baseStart);
    while(s<=limit){
      await addDoc(collection(db,"schedules"),{
        date:fmtDate(s), startAt:Timestamp.fromDate(new Date(s)), endAt:Timestamp.fromDate(new Date(en)),
        teacherId:tId, teacherName:teacherMap[tId]||"",
        academicPeriod:$("academicPeriod").value,
        instituteName:$("instituteName").value.trim(),
        grade:gradeStr, schoolLevel:level, gradeYear:year, classId:cls,
        expectedStudents:Number($("expectedStudents").value),
        region:$("region").value.trim(), courseType:$("courseType").value,
        teacherFeePerClass:Number($("teacherFeePerClass").value||0),
        instituteRevenuePerClass:Number($("instituteRevenuePerClass").value||0),
        note:$("scheduleNote").value.trim(),
        status:"scheduled", createdAt:Timestamp.now()
      });
      if(!isRec)break;
      s.setDate(s.getDate()+7); en.setDate(en.getDate()+7); count++;
    }
    e.target.reset(); $("recurrenceFields").classList.add("hidden");
    setMsg($("scheduleMsg"),`✓ 成功建立 ${count||1} 堂課程！`,false);
    renderCalendar();
  }catch(err){setMsg($("scheduleMsg"),"錯誤："+err.message,true);}
  finally{btn.disabled=false; btn.textContent="確認新增並排入課表";}
};

// ── 行事曆（時間軸版）──
function setMode(m){
  CM=m;
  $("dayBtn").style.background=m==="day"?"var(--gold-dim)":"var(--panel-2)";
  $("weekBtn").style.background=m==="week"?"var(--gold-dim)":"var(--panel)";
  renderCalendar();
}

async function renderCalendar(){
  const base=new Date($("targetDate").value||fmtDate(new Date()));
  const days=CM==="day"?[base]:weekDays(base);
  const filterTid=CR==="Admin"?$("filterTeacher").value:"self";
  const todayStr=fmtDate(new Date());

  // 撈資料
  const allEventsSnap=await Promise.all(days.map(d=>getDocs(query(collection(db,"schedules"),where("date","==",fmtDate(d))))));

  // 整理每天的事件
  const dayEvents=allEventsSnap.map((snap,idx)=>{
    const evs=[];
    snap.forEach(d=>{
      const ev={id:d.id,...d.data()};
      if(CR!=="Admin"&&ev.teacherId!==CU.uid)return;
      if(CR==="Admin"&&filterTid!=="all"&&ev.teacherId!==filterTid)return;
      evs.push(ev);
    });
    return evs;
  });

  // Header
  const head=$("calHead"); head.innerHTML="";
  const hRow=document.createElement("tr");
  const corner=document.createElement("th"); corner.className="cal-th"; corner.style.width="52px"; corner.textContent=""; hRow.appendChild(corner);
  days.forEach((d,i)=>{
    const th=document.createElement("th"); th.className="cal-th"+(fmtDate(d)===todayStr?" today-col":"");
    th.innerHTML=`${d.getMonth()+1}/${d.getDate()}<br><span style="font-size:10px">${"日一二三四五六"[d.getDay()]}</span>`;
    hRow.appendChild(th);
  });
  head.appendChild(hRow);

  // Body — 每小時一行，最後一行加 col-inner 容納事件
  const body=$("calBody"); body.innerHTML="";
  const HOURS=Array.from({length:16},(_,i)=>CAL_START+i); // 07-22

  // 建立每個 day column 的 inner div（用於絕對定位事件）
  const colInners=days.map(()=>null);

  // 先畫時間格
  HOURS.forEach((h,hi)=>{
    const tr=document.createElement("tr"); tr.className="cal-row";
    const td0=document.createElement("td"); td0.className="cal-time-col"; td0.textContent=`${String(h).padStart(2,"0")}:00`; tr.appendChild(td0);
    days.forEach((_,di)=>{
      const td=document.createElement("td"); td.className="cal-day-col";
      td.style.height=ROW_H+"px";
      if(hi===0){
        // 第一行時建立 inner div（設總高度）
        const totalH=ROW_H*HOURS.length;
        const inner=document.createElement("div"); inner.className="day-col-inner"; inner.style.cssText=`height:${totalH}px;position:relative;`;
        td.rowSpan=HOURS.length; td.style.height=totalH+"px"; td.style.padding="0"; td.appendChild(inner);
        colInners[di]=inner;
      }
      tr.appendChild(td);
    });
    // 只有第一行的 td 需要 rowSpan，其他行不加 td（已由 rowSpan 佔用）
    if(hi>0){
      // 移除多餘的 td（只保留時間列）
      while(tr.children.length>1) tr.removeChild(tr.lastChild);
    }
    body.appendChild(tr);
  });

  // 放入事件
  dayEvents.forEach((evs,di)=>{
    const inner=colInners[di]; if(!inner)return;
    evs.forEach(ev=>{
      const st=ev.startAt.toDate(), et=ev.endAt.toDate();
      const startMin=(st.getHours()-CAL_START)*60+st.getMinutes();
      const durMin=(et-st)/60000;
      const topPx=(startMin/60)*ROW_H;
      const heightPx=Math.max((durMin/60)*ROW_H,28);

      const block=document.createElement("div");
      block.className=`ev-block status-${ev.status||"scheduled"}`;
      block.style.cssText=`top:${topPx}px;height:${heightPx}px;`;

      const statusLabel={scheduled:"",checkedin:"✓到班",absent:"請假",rescheduled:"調課",cancelled:"停課"}[ev.status||"scheduled"];
      block.innerHTML=`
        <div class="ev-ins">${ev.instituteName||"-"}</div>
        <div class="ev-time">${hhmm(st)}–${hhmm(et)}</div>
        <div class="ev-grade">${ev.grade||""}</div>
        ${CR==="Admin"?`<div class="ev-teacher">👤${ev.teacherName||""}</div>`:""}
        ${statusLabel?`<div class="ev-status" style="color:${ev.status==="checkedin"?"#6ee7b7":ev.status==="absent"?"#fca5a5":ev.status==="cancelled"?"#9ca3af":"#a5b4fc"}">${statusLabel}</div>`:""}
      `;
      block.onclick=()=>openEventModal(ev.id,ev);
      inner.appendChild(block);
    });
  });
}

// ── 課程操作 Modal ──
function openEventModal(docId,ev){
  currentEventDocId=docId; currentEventData=ev;
  $("eventModalTitle").textContent=ev.instituteName||"-";
  $("eventModalSub").textContent=`${ev.date} ${hhmm(ev.startAt.toDate())}–${hhmm(ev.endAt.toDate())} | ${ev.grade||""}`;
  const statusMap={scheduled:"待上課",checkedin:"✓ 已到班",absent:"請假",rescheduled:"調課",cancelled:"停課"};
  const colorMap={scheduled:"var(--gold)",checkedin:"#6ee7b7",absent:"#fca5a5",rescheduled:"#a5b4fc",cancelled:"#9ca3af"};
  const st=ev.status||"scheduled";
  $("eventModalStatus").textContent=statusMap[st]||st;
  $("eventModalStatus").style.color=colorMap[st]||"var(--text)";

  // 到班打卡區
  const canCheckIn=CR==="Teacher"&&(st==="scheduled"||st==="rescheduled");
  $("checkInArea").classList.toggle("hidden",!canCheckIn);
  $("ciMsg").textContent="";

  // 操作按鈕
  const ab=$("actionBtns"); ab.innerHTML="";
  const actions=[];
  if(CR==="Admin"){
    if(st!=="cancelled") actions.push({label:"🚫 停課",color:"rgba(127,29,29,.5)",fn:()=>updateStatus("cancelled")});
    if(st!=="absent") actions.push({label:"🙏 請假",color:"rgba(100,60,160,.5)",fn:()=>updateStatus("absent")});
    if(st==="cancelled"||st==="absent") actions.push({label:"↩ 恢復",color:"rgba(15,118,110,.5)",fn:()=>updateStatus("scheduled")});
    actions.push({label:"🗑 刪除課程",color:"rgba(192,57,43,.4)",fn:()=>deleteEvent()});
    actions.push({label:"📅 調課",color:"rgba(55,48,163,.5)",fn:()=>$("rescheduleArea").classList.toggle("hidden")});
  } else {
    // 教師可請假
    if(st==="scheduled"||st==="rescheduled") actions.push({label:"🙏 請假",color:"rgba(100,60,160,.5)",fn:()=>updateStatus("absent")});
  }
  actions.forEach(a=>{
    const b=document.createElement("button"); b.className="btn"; b.style.background=a.color; b.textContent=a.label;
    b.onclick=a.fn; ab.appendChild(b);
  });

  $("rescheduleArea").classList.add("hidden"); $("rsMsg").textContent="";
  $("rsStart").value=""; $("rsEnd").value="";
  $("eventModal").classList.remove("hidden");
}

async function renderCourseMgr(){
  // 填老師下拉
  const ts=$("cmFilterTeacher");
  if(ts.options.length<=1){
    allUsers.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.displayName||u.email;ts.appendChild(o);});
  }

  const filterT=$("cmFilterTeacher").value;
  const filterP=$("cmFilterPeriod").value;
  const filterS=$("cmFilterStatus").value;

  const c=$("cmList"); c.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px">載入中…</div>`;

  let q=query(collection(db,"schedules"),orderBy("startAt","desc"));
  const snap=await getDocs(q);

  const statusLabel={scheduled:"待上課",checkedin:"已到班",absent:"請假",rescheduled:"調課",cancelled:"停課"};
  const statusColor={scheduled:"var(--gold)",checkedin:"#6ee7b7",absent:"#fca5a5",rescheduled:"#a5b4fc",cancelled:"#9ca3af"};

  let rows=[], total=0;
  snap.forEach(d=>{
    const ev={id:d.id,...d.data()};
    if(filterT!=="all"&&ev.teacherId!==filterT) return;
    if(filterP!=="all"&&ev.academicPeriod!==filterP) return;
    if(filterS!=="all"&&(ev.status||"scheduled")!==filterS) return;
    rows.push(ev); total++;
  });

  $("cmSummary").textContent=`共 ${total} 筆課程`;
  c.innerHTML="";

  if(rows.length===0){c.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px">無符合條件的課程</div>`;return;}

  rows.forEach(ev=>{
    const st=ev.status||"scheduled";
    const row=document.createElement("div");
    row.style.cssText="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(8,12,20,.6);flex-wrap:wrap;";
    row.innerHTML=`
      <div style="flex:1;min-width:200px">
        <div style="font-weight:700;color:var(--gold-light);font-size:13px">${ev.instituteName||"-"}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${ev.date} ${hhmm(ev.startAt.toDate())}–${hhmm(ev.endAt.toDate())} ｜ ${ev.grade||"-"} ｜ 👤${ev.teacherName||"-"}</div>
        <div style="font-size:11px;color:var(--muted)">${ev.academicPeriod||""} ｜ 鐘點：NT$${ev.teacherFeePerClass||0} ｜ 收費：NT$${ev.instituteRevenuePerClass||0}</div>
      </div>
      <span style="font-size:11px;font-weight:700;color:${statusColor[st]||"var(--text)"};flex-shrink:0">${statusLabel[st]||st}</span>
      <button onclick="openEditCourse('${ev.id}')" class="btn" style="background:var(--panel-2);font-size:12px;padding:6px 12px;flex-shrink:0">編輯</button>
      <button onclick="deleteCourse('${ev.id}')" class="btn btn-red" style="font-size:12px;padding:6px 12px;flex-shrink:0">刪除</button>
    `;
    c.appendChild(row);
  });
}

window.openEditCourse=async(docId)=>{

  $("ecPeriod").value=ev.academicPeriod||"114上學期";

  const toLocal=ts2=>{const d=ts2.toDate();const pad=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  $("ecStart").value=ev.startAt?toLocal(ev.startAt):"";
  $("ecEnd").value=ev.endAt?toLocal(ev.endAt):"";
  $("ecRegion").value=ev.region||"";

  $("ecLevel").value=ev.schoolLevel||"國中";
  $("ecYear").value=ev.gradeYear||"1";
  $("ecClass").value=ev.classId||"";
  $("ecStudents").value=ev.expectedStudents||"";

  $("ecRevenue").value=ev.instituteRevenuePerClass||0;
  $("ecCourseType").value=ev.courseType||"regular";
  $("ecStatus").value=ev.status||"scheduled";
  $("ecNote").value=ev.note||"";
  $("ecMsg").textContent="";
  $("editCourseModal").classList.remove("hidden");
};

// ── 薪資結算 ──
$("calcAllBtn").onclick=()=>renderSalaryPanel();
async function renderSalaryPanel(){
  const month=$("settleMonth").value; if(!month) return;
  const c=$("salaryResult"); c.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:13px">計算中…</div>`;

  // 撈該月所有 schedules（已到班）
  const snap=await getDocs(collection(db,"schedules"));
  const monthlyData={}; // teacherId -> {classes, teacherPay, teacherName}
  const instituteData={}; // instituteName -> {classes, revenue}

  snap.forEach(d=>{
    const ev=d.data();
    if(ev.status!=="checkedin") return;
    if(!ev.checkInAt) return;
    const dm=ev.checkInAt.toDate();
    const rm=`${dm.getFullYear()}-${String(dm.getMonth()+1).padStart(2,"0")}`;
    if(rm!==month) return;

    // 老師薪資
    const tid=ev.teacherId||"unknown";
    if(!monthlyData[tid]) monthlyData[tid]={classes:0,teacherPay:0,teacherName:ev.teacherName||tid};
    monthlyData[tid].classes++;
    monthlyData[tid].teacherPay+=Number(ev.teacherFeePerClass||0);

    // 補習班收入
    const ins=ev.instituteName||"未知";
    if(!instituteData[ins]) instituteData[ins]={classes:0,revenue:0};
    instituteData[ins].classes++;
    instituteData[ins].revenue+=Number(ev.instituteRevenuePerClass||0);
  });

  c.innerHTML="";

  // 老師薪資卡
  const teacherKeys=Object.keys(monthlyData);
  if(teacherKeys.length===0){
    c.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:13px">${month} 無已到班課程記錄</div>`; return;
  }

  const teacherSection=document.createElement("div");
  teacherSection.innerHTML=`<div class="gold-title text-sm mb-3">👤 老師薪資</div>`;
  const tGrid=document.createElement("div"); tGrid.className="grid md:grid-cols-2 gap-3 mb-4";
  teacherKeys.forEach(tid=>{
    const d=monthlyData[tid], card=document.createElement("div"); card.className="salary-card";
    card.innerHTML=`<div style="font-weight:700;margin-bottom:8px;color:var(--gold-light)">${d.teacherName}</div><div style="font-size:12px;color:var(--muted)">上課堂數：<span style="color:var(--text)">${d.classes} 堂</span></div><div style="font-size:12px;color:var(--muted);margin-top:4px">應付薪資：<span class="salary-num">NT$ ${d.teacherPay.toLocaleString()}</span></div>`;
    tGrid.appendChild(card);
  });
  teacherSection.appendChild(tGrid);
  c.appendChild(teacherSection);

  // 補習班收入卡
  const insSection=document.createElement("div");
  insSection.innerHTML=`<div class="gold-title text-sm mb-3">🏫 補習班收入</div>`;
  const iGrid=document.createElement("div"); iGrid.className="grid md:grid-cols-2 gap-3";
  Object.entries(instituteData).forEach(([name,d])=>{
    const card=document.createElement("div"); card.className="salary-card";
    card.innerHTML=`<div style="font-weight:700;margin-bottom:8px;color:var(--gold-light)">${name}</div><div style="font-size:12px;color:var(--muted)">上課堂數：<span style="color:var(--text)">${d.classes} 堂</span></div><div style="font-size:12px;color:var(--muted);margin-top:4px">當月收入：<span class="salary-num">NT$ ${d.revenue.toLocaleString()}</span></div>`;
    iGrid.appendChild(card);
  });
  insSection.appendChild(iGrid);
  c.appendChild(insSection);
}

// ── 工具 ──
async function uploadPhoto(file,path){const r=ref(storage,path);await uploadBytes(r,file,{contentType:file.type||"image/jpeg"});return getDownloadURL(r);}
function setMsg(el,txt,isErr){el.className=isErr?"msg-err":"msg-ok";el.textContent=txt;}
function weekDays(d){const day=d.getDay(),diff=day===0?-6:1-day,mon=new Date(d);mon.setDate(d.getDate()+diff);return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x;});}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function hhmm(d){return d.toTimeString().slice(0,5);}
</script>
