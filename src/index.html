<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宋維國文管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="app" class="min-h-screen">
    <section id="loginView" class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-6">
        <h1 class="text-2xl font-bold mb-1">宋維國文管理系統</h1>
        <p class="text-sm text-slate-500 mb-6">請使用 Email / Password 登入</p>
        <form id="loginForm" class="space-y-4">
          <div><label class="block text-sm mb-1">Email</label><input id="email" type="email" required class="w-full border rounded-lg px-3 py-2" /></div>
          <div><label class="block text-sm mb-1">Password</label><input id="password" type="password" required class="w-full border rounded-lg px-3 py-2" /></div>
          <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2" type="submit">登入</button>
          <p id="loginMsg" class="text-sm text-rose-600"></p>
        </form>
      </div>
    </section>

    <section id="dashboardView" class="hidden">
      <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div><h2 class="font-semibold text-lg">宋維國文管理系統</h2><p id="userInfo" class="text-xs text-slate-500"></p></div>
          <div class="flex items-center gap-2"><button id="dayBtn" class="px-3 py-1.5 rounded bg-slate-900 text-white text-sm">日檢視</button><button id="weekBtn" class="px-3 py-1.5 rounded bg-slate-200 text-sm">週檢視</button><button id="logoutBtn" class="px-3 py-1.5 rounded bg-rose-600 text-white text-sm">登出</button></div>
        </div>
      </header>

      <main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-4">
        <aside class="lg:col-span-3 bg-white rounded-xl border p-4"><h3 class="font-semibold mb-2">功能導覽</h3><ul id="navList" class="space-y-1 text-sm"></ul></aside>

        <section class="lg:col-span-9 space-y-4">
          <div class="bg-white rounded-xl border p-4">
            <div class="flex justify-between items-center mb-3"><h3 class="font-semibold">排程行事曆（07:00-23:00）</h3><input id="targetDate" type="date" class="border rounded px-2 py-1 text-sm" /></div>
            <div id="calendarHeader" class="grid text-xs text-slate-500 mb-2"></div>
            <div id="calendarBody" class="calendar-grid border rounded"></div>
          </div>

          <div class="bg-white rounded-xl border p-4">
            <h3 class="font-semibold mb-3">新增排程</h3>
            <form id="scheduleForm" class="grid md:grid-cols-2 gap-3 text-sm">
              <input id="startAt" type="datetime-local" required class="border rounded px-2 py-2" />
              <input id="endAt" type="datetime-local" required class="border rounded px-2 py-2" />
              <input id="region" placeholder="地區" required class="border rounded px-2 py-2" />
              <input id="instituteName" placeholder="補習班名稱" required class="border rounded px-2 py-2" />
              <input id="grade" placeholder="年級" required class="border rounded px-2 py-2" />
              <input id="expectedStudents" type="number" min="1" placeholder="預估人數" required class="border rounded px-2 py-2" />
              <select id="courseType" required class="border rounded px-2 py-2"><option value="">課程類型</option><option value="regular">常態排課</option><option value="single">單次代調課</option></select>
              <button class="bg-emerald-600 text-white rounded px-3 py-2">儲存排程</button>
            </form>
            <p id="scheduleMsg" class="text-sm mt-2"></p>
          </div>

          <div class="bg-white rounded-xl border p-4">
            <h3 class="font-semibold mb-3">打卡與班級日誌</h3>
            <div class="grid md:grid-cols-2 gap-3 text-sm mb-3">
              <select id="attendanceSchedule"></select>
              <button id="reloadSchedules" class="bg-slate-700 text-white rounded px-3 py-2">重新載入今日排程</button>
            </div>
            <form id="checkInForm" class="grid md:grid-cols-2 gap-3 text-sm mb-4">
              <input id="checkInPhoto" type="file" accept="image/*" capture="environment" required class="border rounded px-2 py-2" />
              <button class="bg-indigo-600 text-white rounded px-3 py-2">上課打卡（拍照）</button>
            </form>
            <form id="checkOutForm" class="grid md:grid-cols-2 gap-3 text-sm">
              <input id="checkOutPhoto" type="file" accept="image/*" capture="environment" required class="border rounded px-2 py-2" />
              <input id="teachingProgress" placeholder="本日教學進度" required class="border rounded px-2 py-2" />
              <input id="testScope" placeholder="測驗範圍" required class="border rounded px-2 py-2" />
              <input id="scoreRange" placeholder="成績區間" required class="border rounded px-2 py-2" />
              <input id="homework" placeholder="回家作業" required class="border rounded px-2 py-2" />
              <input id="specialStudentNotes" placeholder="特殊學生狀況註記" required class="border rounded px-2 py-2" />
              <input id="examPaperCode" placeholder="考卷版本代碼" required class="border rounded px-2 py-2" />
              <button class="bg-amber-600 text-white rounded px-3 py-2">下課打卡並提交日誌</button>
            </form>
            <p id="attendanceMsg" class="text-sm mt-2"></p>
          </div>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
